<!DOCTYPE html>

<html>
  <head>
    <title>URL Shortener Microservice | freeCodeCamp.org</title>
    <link
      rel="icon"
      type="image/png"
      href="https://cdn.freecodecamp.org/universal/favicons/favicon-16x16.png"
    />
    <link href="/public/style.css" rel="stylesheet" type="text/css" />
  </head>

  <body>
    <h1>URL Shortener Microservice</h1>
    <main>
      <section>
        <form action="api/shorturl" method="POST">
          <fieldset>
            <legend>URL Shortener</legend>
            <label for="url_input">URL:</label>
            <input id="url_input" type="text" name="url" placeholder="https://www.freecodecamp.org/" />
            <input type="submit" value="POST URL" />
          </fieldset>
        </form>
      </section>

      <section>
        
          
            <legend>SHORT URL</legend>
            <label for="url_input">URL:</label>
            <a id="short_url_display"></a>
            
          
        </form>
      </section>
    </main>
    <footer>
      
    </footer>


    <script >

      const urlDisplay = document.getElementById('short_url_display');
      const urlInput = document.getElementById('url_input');
      const form = document.querySelector('form');
      const baseUrl = window.location.origin;




      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const url = urlInput.value;
        console.log(`url is ${url}`)
        const response = await fetch('/api/shorturl', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({url}),
        });
        const data = await response.json();
        if (data.error) {
          urlDisplay.textContent = data.error;
        } else {
          urlDisplay.textContent = `http://${data.short_url}`;
          urlDisplay.setAttribute('href', `http://${data.short_url}`);
        }
      });
    </script>
  </body>
</html>
